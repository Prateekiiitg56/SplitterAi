name: SplitterAI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Python Test Suite & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Security & Execution Sandbox Tests
        run: python backend/tests/test_sandbox.py

      - name: Run API Hardening & Import Safety Tests
        run: python backend/tests/test_api_and_imports.py

      - name: Run LLM Gateway Tests
        run: python backend/tests/test_llm_gateway.py

      - name: Run Orchestrator & Worker Tests
        run: python backend/tests/test_orchestrator.py

      - name: Run Workspace & Persistence Tests
        run: python backend/tests/test_workspace_and_persistence.py

  frontend-build:
    name: Frontend TypeScript Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Vite Production Build
        run: npm run build
